name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: npm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: npm/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
